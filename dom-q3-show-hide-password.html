<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Q3 - Show and Hide Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p><a href="index.html">&larr; Back to all questions</a></p>
  <div class="card">
    <h1>Login Form</h1>
    <form onsubmit="return false;">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password">

      <br>
      <button type="button" id="toggleBtn" onclick="togglePassword()">Show Password</button>
    </form>
  </div>
  <script src="dom-q3-show-hide-password.js"></script>
</body>
</html>
