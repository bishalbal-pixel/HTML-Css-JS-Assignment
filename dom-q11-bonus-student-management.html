<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Q11 - Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p><a href="index.html">&larr; Back to all questions</a></p>
  <h1>Student Management System</h1>

  <div class="card">
    <h2>Student Registration Form</h2>
    <form id="studentForm">
      <label for="name">Student Name</label>
      <input type="text" id="name" placeholder="e.g. Ram Sharma">

      <label for="roll">Roll Number</label>
      <input type="text" id="roll" placeholder="e.g. 101">

      <label for="section">Section</label>
      <input type="text" id="section" placeholder="e.g. A">

      <label for="age">Age</label>
      <input type="number" id="age" placeholder="e.g. 20">

      <label for="address">Address</label>
      <input type="text" id="address" placeholder="e.g. Kathmandu">

      <label for="phone">Phone Number</label>
      <input type="text" id="phone" placeholder="e.g. 9800000000">

      <br>
      <button type="button" onclick="addStudent()">Add Student</button>
      <button type="button" onclick="clearForm()">Clear Form</button>
    </form>
    <p id="message"></p>
  </div>

  <div class="card">
    <h2>Student Records</h2>
    <table>
      <thead>
        <tr>
          <th>Roll No.</th>
          <th>Name</th>
          <th>Section</th>
          <th>Age</th>
          <th>Address</th>
          <th>Phone</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="studentTable"></tbody>
    </table>
  </div>

  <script src="dom-q11-bonus-student-management.js"></script>
</body>
</html>
