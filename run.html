<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run JavaScript Question</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p><a href="index.html">&larr; Back to all questions</a></p>
  <h1 id="title">JavaScript Output</h1>
  <p>The output below is also printed in the browser console (press F12).</p>
  <div id="output"></div>
  <button onclick="location.reload()">Run Again</button>

  <script>
    // Shows console.log output on the page as well as in the console,
    // so the Array, Object and Function questions can be checked easily.
    const outputBox = document.getElementById("output");
    const originalLog = console.log;

    function formatValue(value) {
      if (typeof value === "object" && value !== null) {
        return JSON.stringify(value);
      }
      return String(value);
    }

    console.log = function (...args) {
      originalLog.apply(console, args);
      outputBox.textContent += args.map(formatValue).join(" ") + "\n";
    };

    // Load the question file named in the URL, e.g. run.html?file=array-q1-display-students.js
    const fileName = new URLSearchParams(location.search).get("file");

    if (fileName && /^[a-z0-9-]+\.js$/.test(fileName)) {
      document.getElementById("title").textContent = fileName;
      document.title = fileName;
      const script = document.createElement("script");
      script.src = fileName;
      document.body.appendChild(script);
    } else {
      outputBox.textContent = "No question file selected. Go back and choose a question.";
    }
  </script>
</body>
</html>
